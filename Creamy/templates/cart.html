{% extends 'base.html' %}

{% load static %}

{% block content %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <!-- You can include your CSS/JS files here or use Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Main content -->
<div class="container my-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header" style="background-color: #f195b2; color: white;">
                    <h4>Cart</h4>
                </div>
                <div class="card-body">
                    <!-- Displaying the product details -->
                    <div class="text-center">
                        <!-- Product Image -->
                        <img src="{% static 'img/'|add:product.image.name %}" alt="{{ product.name }}" class="img-fluid rounded-circle" style="width: 200px; height: 200px; object-fit: cover;">
                    </div>
                    <h3 class="text-center my-3">{{ product.name }}</h3>
                    <p class="text-center">{{ product.description }}</p>
                    <p class="text-center">
                        <strong>Price: ${{ product.price }}</strong>
                    </p>


                    <!-- cart Form -->
                    <div class="text-center">
                        <a href="{% url 'cart' product.id %}" class="btn btn-success">Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Optional Bootstrap JS (for interactivity) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
{% endblock %}
